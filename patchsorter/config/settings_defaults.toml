# PatchSorter settings defaults
#
# Each entry defines one canonical setting.  The "scope" field controls
# where the setting lives at runtime:
#
#   scope = "application"  – stored with project_id = NULL (app-wide)
#   scope = "project"      – stored per project_id
#
# Fields
# ------
# scope          : "application" | "project"
# default        : string representation of the default value
# type           : "enum" | "string" | "boolean" | "integer"
# allowed_values : (enum only) list of valid values
# disabled       : (boolean, default false) if true the value cannot be
#                  changed after the initial seed — the setting is read-only
# description    : (optional str) human-readable description of the setting

# ---------------------------------------------------------------------------
# Project-scoped settings
# ---------------------------------------------------------------------------

[settings.world_size]
scope    = "project"
default  = "4096"
type     = "integer"
disabled = true
description = "The size of the world in microns"

[settings.agg_hierarchy_depth]
scope    = "project"
default  = "4"
type     = "integer"
disabled = true
description = "Number of aggregation hierarchy levels (must be greater than 1)"

[settings.osm_zoom_offset]
scope    = "project"
default  = "8"
type     = "integer"
disabled = true
description = "Coarsest aggregation level; maps OSM tile zoom z=0 to grid level 8"

[settings.max_level]
scope    = "project"
default  = "12"
type     = "integer"
disabled = true
description = "Finest aggregation level; equals osm_zoom_offset + agg_hierarchy_depth"

[settings.dl_num_workers]
scope   = "project"
default = "1"
type    = "integer"
description = "Number of workers for deep learning inference"

[settings.dl_patches_per_batch]
scope   = "project"
default = "1024"
type    = "integer"
description = "Number of patches per batch for deep learning inference"

[settings.patch_size]
scope = "project"
default = "64"
type = "integer"
description = "Size of each patch in pixels"

[settings.patch_extraction_method]
scope          = "project"
default        = "use manual object radius"
type           = "enum"
allowed_values = ["use estimated object size", "use manual object radius", "fit all objects"]
description = "Method for extracting patches from tissue objects"

[settings.object_radius]
scope   = "project"
default = "10"
type    = "integer"
description = "Radius of objects in microns (only used when patch_extraction_method is 'use manual object radius')"

# ---------------------------------------------------------------------------
# Application-scoped settings
# ---------------------------------------------------------------------------

[settings.log_level]
scope          = "application"
default        = "INFO"
type           = "enum"
allowed_values = ["DEBUG", "INFO", "WARNING", "ERROR"]
description = "Application logging level"
