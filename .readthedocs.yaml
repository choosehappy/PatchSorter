version: "2"

build:
  os: "ubuntu-22.04"
  tools:
    python: "3.14"
  jobs:
    pre_build:
      - pip install --no-deps -e .
      - pip install -r docs/requirements.txt
    post_build:
      - sphinx-build -b html docs/source $READTHEDOCS_OUTPUT/html

sphinx:
  configuration: docs/source/conf.py