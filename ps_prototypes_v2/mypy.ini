[mypy]
# Ignore missing library stubs for specific modules
ignore_missing_imports = True

# Allow untyped calls and definitions (for now)
warn_return_any = False
warn_unused_configs = True

# Add explicit module paths to ignore if needed
[mypy-torchvision.*]
ignore_missing_imports = True

[mypy-albumentations.*]
ignore_missing_imports = True

[mypy-tables]
ignore_missing_imports = True

[mypy-tqdm]
ignore_missing_imports = True