[build-system]
requires = ["setuptools >= 64", "setuptools_scm >= 8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "patchsorter"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.1",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "pillow>=12.2.0",
    "psycopg>=3.3.4",
    "sqlalchemy>=2.0",
    "ray[train,default]>=2.55.1",
    "torch>=2.12.0",
    "uvicorn>=0.47.0",
    "pytest>=9.0.3",
    "large-image[common]>=1.34.1",
    "gdal==3.12.3",
    "geoalchemy2>=0.16",
    "shapely>=2.0",
    "albumentations>=2.0.8",
]
dynamic = ["version"]  # ← version comes from setuptools_scm

[project.optional-dependencies]
dev = ["pytest>=8.0"]

# ----------------------------------------------------------------------------------
[project.scripts]
patchsorter = "patchsorter.__main__:main"


# ----------------------------------------------------------------------------------
[tool.setuptools]
packages = ["patchsorter"]


# ----------------------------------------------------------------------------------
[tool.setuptools_scm]
write_to = "patchsorter/_version.py"
version_scheme = "post-release"
local_scheme = "node-and-date"

# ----------------------------------------------------------------------------------
[tool.distutils.egg_info]
egg_base = "../"

# ----------------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["patchsorter/tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]

